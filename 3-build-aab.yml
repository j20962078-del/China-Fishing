name: 3. Собрать AAB (Google Play, не приоритет)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Освободить место на диске
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      - name: Keystore из секрета (если задан)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"; else echo "Keystore не задан — будет отладочная подпись"; fi
      - name: Сборка AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: /github/workspace/release.keystore
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.23f1
          buildMethod: ChinaFishing.EditorTools.ProjectBuilder.BuildAab
          allowDirtyBuild: true
          versioning: None
      - uses: actions/upload-artifact@v4
        with:
          name: ChinaFishing-AAB
          path: build/Android/ChinaFishing.aab
          if-no-files-found: error
